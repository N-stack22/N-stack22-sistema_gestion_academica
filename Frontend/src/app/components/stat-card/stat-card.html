<div class="stat-card card border-0 shadow-sm h-100" [class]="'stat-card--' + variant()">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-start gap-3">
      <div>
        <p class="stat-card__title mb-1">{{ title() }}</p>
        <p class="stat-card__value mb-2">{{ value() }}</p>
        @if (description()) {
          <p class="stat-card__description mb-0">{{ description() }}</p>
        }
      </div>
      <span class="stat-card__icon" aria-hidden="true">
        <i class="bi" [ngClass]="icon()"></i>
      </span>
    </div>
  </div>
</div>
