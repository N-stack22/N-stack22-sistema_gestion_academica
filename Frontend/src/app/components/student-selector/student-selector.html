@if (roleContext.isParent() && parentContext.hasLinkedStudents()) {
  <div class="student-selector admin-card p-3 mb-3">
    <div class="row g-2 align-items-center">
      <div class="col-md-auto">
        <label class="form-label mb-0 fw-semibold" for="linked-student-select">
          <i class="bi bi-people-fill horizonte-icon-inline" aria-hidden="true"></i>
          Estudiante a consultar
        </label>
      </div>
      <div class="col-md-6 col-lg-4">
        <select
          id="linked-student-select"
          class="form-select"
          [value]="parentContext.selectedStudentId() ?? ''"
          (change)="onStudentChange($any($event.target).value)"
        >
          @for (student of parentContext.linkedStudents(); track student.id) {
            <option [value]="student.id">{{ parentContext.studentLabel(student) }}</option>
          }
        </select>
      </div>
      @if (parentContext.selectedStudent(); as student) {
        <div class="col-md text-muted small">
          {{ student.level }} · {{ student.grade }} {{ student.section }}
        </div>
      }
    </div>
  </div>
}
