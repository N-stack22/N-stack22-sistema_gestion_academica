<div class="data-table card border-0 shadow-sm">
  @if (title()) {
    <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
      <h3 class="h6 text-horizonte-blue fw-bold mb-0">
        <i class="bi horizonte-icon-inline" [ngClass]="icon()" aria-hidden="true"></i>
        {{ title() }}
      </h3>
    </div>
  }

  <div class="card-body p-0">
    @if (rows().length === 0) {
      <app-empty-state
        title="Sin registros"
        message="No hay datos para mostrar en esta tabla."
        icon="bi-inbox"
      />
    } @else {
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              @for (column of columns(); track column.key) {
                <th scope="col">{{ column.label }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (row of rows(); track $index) {
              <tr>
                @for (column of columns(); track column.key) {
                  <td>{{ cellValue(row, column.key) }}</td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
