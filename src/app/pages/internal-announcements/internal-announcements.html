<div class="admin-page erp-module-shell">
  <header class="mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
      <div>
        <span class="badge admin-page__badge-module mb-2">Comunicación interna</span>
        <h1 class="h4 text-horizonte-blue fw-bold mb-1">
          <i class="bi bi-megaphone horizonte-icon-inline" aria-hidden="true"></i>
          Comunicados internos
        </h1>
        <p class="text-muted mb-0">Comunicados simulados para la comunidad educativa Horizonte.</p>
      </div>
      <span class="badge bg-warning text-dark">Datos simulados para fines académicos</span>
    </div>
  </header>

  <app-data-table
    title="Comunicados de la intranet"
    subtitle="Comunicados internos con alcance, fecha y estado de publicación."
    icon="bi-megaphone"
    [columns]="columns"
    [rows]="rows"
  />
</div>
