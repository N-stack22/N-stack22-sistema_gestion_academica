<div class="admin-page erp-module-shell">
  <header class="mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
      <div>
        <span class="badge admin-page__badge-module mb-2">Gestión institucional</span>
        <h1 class="h4 text-horizonte-blue fw-bold mb-1">
          <i class="bi bi-bag-check horizonte-icon-inline" aria-hidden="true"></i>
          Ventas
        </h1>
        <p class="text-muted mb-0">Ventas internas simuladas del colegio.</p>
      </div>
      <span class="badge bg-warning text-dark">Datos simulados para fines académicos</span>
    </div>
  </header>

  <div class="alert alert-info py-2 mb-4 border-0 shadow-sm" role="status">
    <i class="bi bi-info-circle horizonte-icon-inline" aria-hidden="true"></i>
    Módulo simulado para fines académicos. No procesa ventas reales.
  </div>

  <section class="mb-4 erp-kpi-row">
    <div class="row g-3">
      @for (metric of metrics; track metric.id) {
        <div class="col-sm-6 col-lg-3">
          <app-stat-card
            [title]="metric.title"
            [value]="metric.value"
            [description]="metric.description"
            [icon]="metric.icon"
            [variant]="metric.variant"
          />
        </div>
      }
    </div>
  </section>

  <app-data-table
    title="Ventas internas"
    subtitle="Registro simulado de ventas internas — no procesa transacciones reales."
    icon="bi-bag-check"
    [columns]="columns"
    [rows]="rows"
  />
</div>
