<div class="admin-page">
  <header class="mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
      <div>
        <span class="badge admin-page__badge-module mb-2">Módulo académico</span>
        <h1 class="h4 text-horizonte-blue fw-bold mb-1">
          <i class="bi bi-gear-fill horizonte-icon-inline" aria-hidden="true"></i>
          Configuración
        </h1>
        <p class="text-muted mb-0">Panel simulado de ajustes del sistema ERP académico.</p>
      </div>
      <span class="badge bg-warning text-dark">Datos simulados para fines académicos</span>
    </div>
  </header>

  <div class="row g-4">
    @for (card of cards; track card.title) {
      <div class="col-md-6">
        <div class="card admin-module-card h-100">
          <div class="card-body p-4">
            <h2 class="h6 text-horizonte-blue fw-bold mb-2">
              <i class="bi horizonte-icon-inline" [class]="card.icon" aria-hidden="true"></i>
              {{ card.title }}
            </h2>
            <p class="text-muted mb-0">{{ card.description }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
