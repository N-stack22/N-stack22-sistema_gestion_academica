<div class="admin-page erp-module-shell">
  <header class="mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
      <div>
        <span class="badge admin-page__badge-module mb-2">Gestión institucional</span>
        <h1 class="h4 text-horizonte-blue fw-bold mb-1">
          <i class="bi bi-file-earmark-person horizonte-icon-inline" aria-hidden="true"></i>
          Matrículas
        </h1>
        <p class="text-muted mb-0">Control simulado de matrículas del año escolar 2026.</p>
      </div>
      <span class="badge bg-warning text-dark">Datos simulados para fines académicos</span>
    </div>
  </header>

  <section class="mb-4">
    <div class="row g-3">
      @for (metric of metrics; track metric.id) {
        <div class="col-md-4">
          <app-stat-card
            [title]="metric.title"
            [value]="metric.value"
            [description]="metric.description"
            [icon]="metric.icon"
            [variant]="metric.variant"
          />
        </div>
      }
    </div>
  </section>

  <app-data-table
    title="Registro de matrículas"
    subtitle="Matrículas simuladas por nivel, grado y estado académico."
    icon="bi-file-earmark-person"
    [columns]="columns"
    [rows]="rows"
  />
</div>
