<div class="admin-page erp-module-shell">
  <header class="mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
      <div>
        <span class="badge admin-page__badge-module mb-2">Módulo académico</span>
        <h1 class="h4 text-horizonte-blue fw-bold mb-1">
          <i class="bi bi-person-gear horizonte-icon-inline" aria-hidden="true"></i>
          Usuarios
        </h1>
        <p class="text-muted mb-0">Listado simulado de usuarios del sistema por rol.</p>
      </div>
      <span class="badge bg-warning text-dark">Datos simulados para fines académicos</span>
    </div>
  </header>

  <app-data-table
    title="Usuarios del sistema"
    subtitle="Usuarios simulados con rol, estado y último acceso."
    icon="bi-person-gear"
    [columns]="columns"
    [rows]="rows"
  />
</div>
